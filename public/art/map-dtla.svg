<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="IBM Plex Mono, ui-monospace, monospace">
  <!-- land -->
  <rect width="600" height="420" rx="14" fill="#EFE6D6"/>
  <!-- ocean (Santa Monica Bay and the coast down to Long Beach) -->
  <path d="M0 0 H70 Q96 70 118 128 Q138 172 156 196 Q170 222 174 258 Q176 290 164 318 Q150 344 174 360 Q214 378 262 380 Q300 382 332 396 Q352 406 360 420 H0 Z" fill="#DCE3D6"/>
  <path d="M70 0 Q96 70 118 128 Q138 172 156 196 Q170 222 174 258 Q176 290 164 318 Q150 344 174 360 Q214 378 262 380 Q300 382 332 396 Q352 406 360 420" stroke="#9FAE8E" stroke-width="2"/>
  <!-- wave sketches -->
  <g stroke="#B7C3AC" stroke-width="1.3">
    <path d="M30 150 q8 -5 16 0 t16 0"/><path d="M60 210 q8 -5 16 0 t16 0"/><path d="M24 270 q8 -5 16 0 t16 0"/>
    <path d="M90 300 q8 -5 16 0 t16 0"/><path d="M50 350 q8 -5 16 0 t16 0"/><path d="M150 395 q8 -5 16 0 t16 0"/>
  </g>
  <!-- mountains: Santa Monica Mountains and San Gabriels -->
  <g stroke="#B9A383" stroke-width="1.4">
    <path d="M110 92 l14 -18 l12 16 l14 -20 l14 18 l12 -14 l14 18"/>
    <path d="M200 70 l12 -14 l12 12 l12 -16 l12 14"/>
    <path d="M400 46 l16 -22 l14 18 l16 -24 l16 22 l14 -16 l16 20 l14 -18 l16 22"/>
  </g>
  <!-- freeways -->
  <g stroke="#CDBB9C" stroke-width="3.2">
    <path d="M156 194 Q240 206 330 214 Q460 222 600 228"/>                 <!-- I-10 -->
    <path d="M206 54 Q214 140 196 210 Q190 250 212 300 Q236 340 268 382"/>  <!-- I-405 -->
    <path d="M226 96 Q280 150 330 214"/>                                   <!-- US-101 -->
    <path d="M330 214 Q326 300 312 382"/>                                  <!-- I-110 -->
    <path d="M372 30 Q356 140 330 214 Q420 280 600 336"/>                  <!-- I-5 -->
    <path d="M330 214 Q420 150 470 104"/>                                  <!-- to Pasadena -->
  </g>
  <g stroke="#F4EFE4" stroke-width="1" stroke-dasharray="4 5">
    <path d="M156 194 Q240 206 330 214 Q460 222 600 228"/>
    <path d="M206 54 Q214 140 196 210 Q190 250 212 300 Q236 340 268 382"/>
    <path d="M226 96 Q280 150 330 214"/>
    <path d="M330 214 Q326 300 312 382"/>
    <path d="M372 30 Q356 140 330 214 Q420 280 600 336"/>
    <path d="M330 214 Q420 150 470 104"/>
  </g>
  <!-- downtown grid sketch -->
  <g stroke="#B9A383" stroke-width="1">
    <path d="M318 196 l22 22 M326 190 l22 22 M310 204 l22 22"/>
    <path d="M340 196 l-22 22 M348 204 l-22 22"/>
  </g>
  <!-- labels -->
  <g fill="#8A8170" font-size="11" letter-spacing="1.2">
    <text x="168" y="184">SANTA MONICA</text>
    <text x="236" y="118">HOLLYWOOD</text>
    <text x="452" y="94">PASADENA</text>
    <text x="196" y="276">LAX</text>
    <text x="300" y="402">LONG BEACH</text>
    <text x="22" y="108" fill="#8E9C80">PACIFIC</text>
  </g>
  <text x="352" y="246" fill="#5E6B2E" font-size="11.5" font-weight="600" letter-spacing="1.2">DOWNTOWN LA</text>
  <!-- pin, just off downtown -->
  <g transform="translate(338 206)">
    <circle r="10" fill="#7A8B3F" fill-opacity=".25">
      <animate attributeName="r" values="10;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".35;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="0" cy="2" rx="7" ry="2.5" fill="#5E523A" fill-opacity=".25"/>
    <path d="M0 0 C-4 -8 -14 -14 -14 -26 A14 14 0 1 1 14 -26 C14 -14 4 -8 0 0 Z" fill="#5E6B2E" stroke="#F4EFE4" stroke-width="2"/>
    <circle cx="0" cy="-26" r="5" fill="#F4EFE4"/>
  </g>
  <!-- compass -->
  <g transform="translate(560 384)" stroke="#8A8170" stroke-width="1.4">
    <path d="M0 -16 L5 0 L0 -4 L-5 0 Z" fill="#8A8170"/>
    <text x="-4" y="-22" fill="#8A8170" stroke="none" font-size="10">N</text>
  </g>
</svg>
